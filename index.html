<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapper</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <header>
        <h1>Mapper</h1>
        <p>Explore the world and uncover the map</p>
    </header>

    <!-- auth (logged out) -->
    <div id="auth-screen">
        <div id="auth-box">
            <h2 id="auth-title">Sign In</h2>
            <input type="email" id="auth-email" placeholder="Email" />
            <input type="password" id="auth-password" placeholder="Password" />
            <button id="auth-submit">Sign In</button>
            <button id="auth-toggle">No account? Sign Up</button>
            <p id="auth-error"></p>
        </div>
    </div>

    <!-- logged in -->
    <div id="app-screen" style="display:none; flex-direction:column; flex:1;">
        <div class="container">
            <div id="map"></div>
            <div class="info">
                <p>
                    Current Location: <span id="coords">Not found</span>
                    <button id="logout-btn">Log Out</button>
                </p>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
