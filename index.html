<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapper</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <!-- auth (logged out) -->
    <div id="auth-screen">
        <div id="auth-box">
            <h2 id="auth-title">Sign In</h2>
            <input type="email" id="auth-email" placeholder="Email" />
            <input type="password" id="auth-password" placeholder="Password" />
            <input type="text" id="auth-username" placeholder="Username" class="hidden" />
            <button id="auth-submit">Sign In</button>
            <button id="auth-toggle">No account? Sign Up</button>
            <p id="auth-error"></p>
        </div>
    </div>

    <!-- main -->
    <div id="app-screen" class="hidden">
        <header>
            <button id="add-friend-btn">Friends</button>
            <h1>Mapper</h1>
            <p>Explore the world and uncover the map</p>
            <button id="profile-btn" title="Profile">
                <img id="profile-avatar" src="" alt="" class="hidden" />
                <span id="profile-initials"></span>
            </button>
        </header>

        <div class="container">
            <div id="map"></div>
            <div class="info">
                <p>Current Location: <span id="coords">Not found</span></p>
            </div>
        </div>
    </div>

    <!-- profile -->
    <div id="profile-modal" class="hidden">
        <div id="profile-panel">
            <button id="close-profile">✕</button>
            <div id="avatar-section">
                <div id="avatar-preview">
                    <img id="modal-avatar-img" src="" alt="" class="hidden" />
                    <span id="modal-avatar-initials"></span>
                </div>
                <label id="avatar-upload-label">
                    Change Photo
                    <input type="file" id="avatar-upload" accept="image/*" class="hidden" />
                </label>
            </div>

            <div class="profile-field">
                <label>Username</label>
                <div class="field-row">
                    <input type="text" id="profile-username" />
                    <button id="save-username">Save</button>
                </div>
                <p id="username-note"></p>
            </div>

            <div class="profile-field">
                <label>Circle Colour</label>
                <div class="field-row">
                    <input type="color" id="profile-color" />
                    <button id="save-color">Save</button>
                </div>
            </div>

            <button id="logout-btn">Log Out</button>
            <p id="profile-status"></p>
        </div>
    </div>

    <!-- add friend -->
    <div id="add-friend-modal" class="hidden">
        <div id="add-friend-panel">
            <button id="close-add-friend">✕</button>
            <h2>Friends</h2>
            
            <div id="friend-tabs">
                <button id="tab-add-request" class="friend-tab active">Send Request</button>
                <button id="tab-requests" class="friend-tab">Requests</button>
                <button id="tab-friends-list" class="friend-tab">My Friends</button>
            </div>
            
            <div id="send-request-section" class="friend-tab-content active">
                <h3>Send Friend Request</h3>
                <div class="friend-field">
                    <label>Username</label>
                    <input type="text" id="friend-username" placeholder="Enter friend's username" />
                </div>
                <button id="send-friend-request">Send Request</button>
                <p id="friend-status"></p>
            </div>
            
            <div id="requests-section" class="friend-tab-content">
                <h3>Friend Requests</h3>
                <div id="requests-list"></div>
                <p id="no-requests-message">No pending friend requests</p>
            </div>
            
            <div id="friends-list-section" class="friend-tab-content">
                <h3>My Friends</h3>
                <div id="friends-list"></div>
                <p id="no-friends-message">No friends yet</p>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
