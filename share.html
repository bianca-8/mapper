<body>

    <script>
        const SUPABASE_URL =
            'https://tlngsxgivvbxhtojihzu.supabase.co';

        const SUPABASE_ANON_KEY =
            'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRsbmdzeGdpdnZieGh0b2ppaHp1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY5NjM3MjYsImV4cCI6MjA5MjUzOTcyNn0.wIBL6jU2pezmZ88RuL18_NLnnckIMzMaNcfQXXOY_eA';

        const sb = supabase.createClient(
            SUPABASE_URL,
            SUPABASE_ANON_KEY
        );

        async function loadSharedMap() {

            const params =
                new URLSearchParams(window.location.search);

            const token = params.get("token");

            if (!token) {
                document.body.innerHTML = "Invalid link";
                return;
            }

            const { data, error } = await sb
                .from('share_links')
                .select('*')
                .eq('token', token)
                .single();
                    
            if (error || !data) {
                document.body.innerHTML = "Share not found";
                return;
            }
            
            console.log("Shared user:", data.shared_user_id); // DELETE AFTER

            const { data: locations } = await sb
                .from('visited_locations')
                .select('*')
                .eq('user_id', data.shared_user_id);

                console.log(locations); // DELETE AFTER
            }

            loadSharedMap();
    </script>
